<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

      font-family: "Sarcastic Robot";
      src: url("fonts/SarcasticRobot.ttf") format("truetype");
      font-display: swap;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;

      color: #e6edf3;
      font-family: "Sarcastic Robot", monospace;
      text-align: center;
    }

    main {
      max-width: 40rem;
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: clamp(2rem, 8vw, 4.5rem);
      line-height: 1.1;
      font-weight: normal;
      color: #ff5c5c;
    }

    p {
      margin: 0;
      font-size: clamp(1rem, 3.5vw, 1.5rem);
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>YOU HAVE BEEN QUISHED.</h1>
    <p>STAY TUNED WITH THE SCHOOL OF LAW'S CYBER CELL FOR UPDATES.</p>
